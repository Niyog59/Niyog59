name: Update Job Observatory stats

# Runs after the evening collection/publish on the server (9 PM CT),
# plus a morning catch-up. Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "30 4 * * *"   # 10:30 PM CT approx (04:30 UTC)
    - cron: "30 14 * * *"  # morning catch-up (14:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live stats and rewrite README blocks
        run: python3 scripts/update_profile_stats.py

      - name: Commit only if the numbers changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md assets/projects/job-observatory-stats.svg
            git commit -m "chore: refresh Job Observatory stats"
            git push
          else
            echo "Numbers unchanged, no commit."
          fi
